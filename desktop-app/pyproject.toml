[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arocall-agent"
version = "0.3.0"
description = "Arocall Linux desktop agent: tray call recorder + uploader"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.24",
  "pystray>=0.19",
  "Pillow>=10.0",
  "keyring>=24.0",
  "webrtcvad-wheels>=2.0",
]

[project.scripts]
arocall-agent = "arocall_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arocall_agent = ["assets/icon.png"]
